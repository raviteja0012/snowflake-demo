  #   project_owner: PROD_AMI_DEPLOY_ROLE
  #   templating_config: PROD

templating:
  # Shared across all envs. Schema names don't change between envs.
  defaults:
    corp_sch:  AMICORP
    comm_sch:  AMICOMM
    frmwk_sch: FRAMEWORK
    stage_sch: AMISTAGE

  # Env-specific values. Add TEST / PROD configurations later.
  configurations:
    DEV:
      env_db: AMI_DEMO_DB
      env_suffix: ''
      ami_mat_role: DEV_AMI_LOAD_ROLE
      ami_sel_role: DEV_AMI_SELECT_ROLE
      ami_support_role: NONPROD_AMI_SUPPORT_ROLE

    # TEST:
