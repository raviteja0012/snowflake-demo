name: DCM Project Plan and Deploy

# Phase 3: declarative deploys via DCM Projects.
# Verified against:
#   https://docs.snowflake.com/en/sql-reference/sql/execute-dcm-project
#   https://docs.snowflake.com/en/user-guide/dcm-projects/dcm-projects-use
#
# Flow:
#   PR to main with dcm/* changes  -> PLAN only (preview)
#   push to main with dcm/* changes -> PLAN then DEPLOY
#   workflow_dispatch              -> manual, plan_only toggle

on:
  push:
    branches: [main]
    paths:
      - 'dcm/**'
      - '.github/workflows/dcm-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dcm/**'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'DCM configuration name from manifest.yml (DEV, TEST, PROD)'
        required: false
        default: 'DEV'
      plan_only:
        description: 'Only PLAN, skip DEPLOY'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dcm:
    name: DCM Plan and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY_FILE: /home/runner/.snowflake/rsa_key.p8
      SNOWFLAKE_ROLE: DEV_AMI_ADMIN_ROLE
      SNOWFLAKE_WAREHOUSE: NONPROD_AMI_ADMIN_WH
      SNOWFLAKE_DATABASE: AMI_DEMO_DB
      DCM_CONFIG: ${{ inputs.configuration || 'DEV' }}
      DCM_PROJECT_NAME: AMI_DEMO_DB.GIT_OPS.AMI_DCM_PROJECT
      DCM_FROM_PATH: '@AMI_DEMO_DB.GIT_OPS.AMI_GIT_REPO/branches/main/dcm/'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize DCM log
        run: |
          LOG_DIR="$GITHUB_WORKSPACE/logs"
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/ami_dcm_$(date -u +%Y%m%d_%H%M%S)_run${{ github.run_id }}.log"
          echo "LOG_FILE=$LOG_FILE" >> "$GITHUB_ENV"
          {
            echo "==========================================================="
            echo "  AMI DCM Project Deploy Log"
            echo "==========================================================="
            echo "  Run ID        : ${{ github.run_id }}"
            echo "  Commit        : ${{ github.sha }}"
            echo "  Branch        : ${{ github.ref_name }}"
            echo "  Event         : ${{ github.event_name }}"
            echo "  Actor         : ${{ github.actor }}"
            echo "  Configuration : $DCM_CONFIG"
            echo "  Project       : $DCM_PROJECT_NAME"
            echo "  From          : $DCM_FROM_PATH"
            echo "  Started       : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "==========================================================="
            echo ""
          } | tee "$LOG_FILE"

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0

      - name: Write private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          echo "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      - name: Verify connection
        run: |
          set -o pipefail
          {
            echo ""
            echo "----- $(date -u '+%H:%M:%S UTC') -- Verify connection -----"
          } | tee -a "$LOG_FILE"
          snow sql -x -q "SELECT CURRENT_USER() AS user, CURRENT_ROLE() AS role, CURRENT_DATABASE() AS db, CURRENT_TIMESTAMP() AS ts;" 2>&1 | tee -a "$LOG_FILE"

      - name: Fetch git repo so DCM sees latest commit
        # DCM reads files from the GIT REPOSITORY clone inside Snowflake.
        # FETCH first so the clone has whatever we just pushed.
        run: |
          set -o pipefail
          {
            echo ""
            echo "----- $(date -u '+%H:%M:%S UTC') -- ALTER GIT REPOSITORY FETCH -----"
          } | tee -a "$LOG_FILE"
          snow sql -x -q "ALTER GIT REPOSITORY AMI_DEMO_DB.GIT_OPS.AMI_GIT_REPO FETCH;" 2>&1 | tee -a "$LOG_FILE"
          snow sql -x -q "SHOW GIT BRANCHES IN AMI_DEMO_DB.GIT_OPS.AMI_GIT_REPO;" 2>&1 | tee -a "$LOG_FILE"

      - name: Ensure DCM project object exists (idempotent self-bootstrap)
        # First time this workflow runs, the DCM project object doesn't exist.
        # Service user is ACCOUNTADMIN-capable, so do the bootstrap here once.
        # GRANT + CREATE IF NOT EXISTS are both idempotent. No-op after first run.
        run: |
          set -o pipefail
          {
            echo ""
            echo "----- $(date -u '+%H:%M:%S UTC') -- Self-bootstrap DCM project (idempotent) -----"
          } | tee -a "$LOG_FILE"
          snow sql -x -q "
          USE ROLE ACCOUNTADMIN;
          GRANT CREATE DCM PROJECT ON SCHEMA AMI_DEMO_DB.GIT_OPS TO ROLE DEV_AMI_ADMIN_ROLE;

          USE ROLE      DEV_AMI_ADMIN_ROLE;
          USE WAREHOUSE NONPROD_AMI_ADMIN_WH;
          USE SCHEMA    AMI_DEMO_DB.GIT_OPS;

          CREATE DCM PROJECT IF NOT EXISTS AMI_DCM_PROJECT
              LOG_LEVEL = INFO
              COMMENT   = 'AMI DCM project. Declarative deploys for Phase 3.';

          USE ROLE ACCOUNTADMIN;
          GRANT READ ON DCM PROJECT AMI_DEMO_DB.GIT_OPS.AMI_DCM_PROJECT TO ROLE NONPROD_AMI_SUPPORT_ROLE;

          USE ROLE DEV_AMI_ADMIN_ROLE;
          SHOW DCM PROJECTS LIKE 'AMI_DCM_PROJECT' IN SCHEMA AMI_DEMO_DB.GIT_OPS;
          " 2>&1 | tee -a "$LOG_FILE"

      - name: DCM PLAN
        run: |
          set -o pipefail
          {
            echo ""
            echo "----- $(date -u '+%H:%M:%S UTC') -- DCM PLAN (configuration $DCM_CONFIG) -----"
          } | tee -a "$LOG_FILE"
          snow sql -x -q "
          USE ROLE DEV_AMI_ADMIN_ROLE;
          USE SECONDARY ROLES NONE;
          EXECUTE DCM PROJECT ${DCM_PROJECT_NAME} PLAN
              USING CONFIGURATION ${DCM_CONFIG}
          FROM '${DCM_FROM_PATH}';
          " 2>&1 | tee -a "$LOG_FILE"

      - name: DCM DEPLOY
        # Skip on PRs (plan-only review). Skip when plan_only=true.
        if: github.event_name != 'pull_request' && inputs.plan_only != true
        run: |
          set -o pipefail
          ALIAS="gha_run_${{ github.run_id }}_$(echo ${{ github.sha }} | cut -c1-7)"
          {
            echo ""
            echo "----- $(date -u '+%H:%M:%S UTC') -- DCM DEPLOY (configuration $DCM_CONFIG, alias $ALIAS) -----"
          } | tee -a "$LOG_FILE"
          snow sql -x -q "
          USE SECONDARY ROLES NONE;
          EXECUTE DCM PROJECT ${DCM_PROJECT_NAME} DEPLOY AS '${ALIAS}'
              USING CONFIGURATION ${DCM_CONFIG}
          FROM '${DCM_FROM_PATH}';
          " 2>&1 | tee -a "$LOG_FILE"

      - name: Show deployment history
        if: github.event_name != 'pull_request' && inputs.plan_only != true
        run: |
          set -o pipefail
          {
            echo ""
            echo "----- $(date -u '+%H:%M:%S UTC') -- Deployment history -----"
          } | tee -a "$LOG_FILE"
          snow sql -x -q "SHOW DEPLOYMENTS IN DCM PROJECT ${DCM_PROJECT_NAME};" 2>&1 | tee -a "$LOG_FILE"

      - name: Verify managed objects
        if: github.event_name != 'pull_request' && inputs.plan_only != true
        run: |
          set -o pipefail
          {
            echo ""
            echo "----- $(date -u '+%H:%M:%S UTC') -- SHOW ENTITIES IN DCM PROJECT -----"
          } | tee -a "$LOG_FILE"
          snow sql -x -q "SHOW ENTITIES IN DCM PROJECT ${DCM_PROJECT_NAME};" 2>&1 | tee -a "$LOG_FILE"

      - name: Finalize log
        if: always()
        run: |
          {
            echo ""
            echo "==========================================================="
            echo "  AMI DCM Project Deploy Log - Finished"
            echo "  Ended    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "==========================================================="
          } | tee -a "$LOG_FILE"

      - name: Upload DCM log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ami-dcm-log-run${{ github.run_id }}
          path: ${{ env.LOG_FILE }}
          retention-days: 30
          if-no-files-found: warn
