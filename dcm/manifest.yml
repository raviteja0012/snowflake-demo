# manifest.yml - DCM Projects target map for AMI demo
#
# Verified against:
#   https://docs.snowflake.com/en/user-guide/dcm-projects/dcm-projects-files
#
# Schema:
#   manifest_version: 2
#   type: DCM_PROJECT
#   default_target: <name>
#   targets:
#     <name>:
#       account_identifier: <org-account>
#       project_name: <fully.qualified.project>
#       project_owner: <role>
#       templating_config: <config_name from templating.configurations>
#   templating:
#     defaults: { ...shared vars... }
#     configurations:
#       <CONFIG_NAME>: { ...env-specific vars... }

manifest_version: 2
type: DCM_PROJECT

default_target: dev

targets:
  dev:
    account_identifier: KEGHDAI-GVA52989
    project_name: AMI_DEMO_DB.GIT_OPS.AMI_DCM_PROJECT
    project_owner: DEV_AMI_ADMIN_ROLE
    templating_config: DEV

  # Stubs for later. Uncomment when test/prod accounts exist.
  # test:
  #   account_identifier: <ORG-ACCT_TEST>
  #   project_name: AMI_TEST_DB.GIT_OPS.AMI_DCM_PROJECT
  #   project_owner: TEST_AMI_ADMIN_ROLE
  #   templating_config: TEST
  #
  # prod:
  #   account_identifier: <ORG-ACCT_PROD>
